global:
  namespace: kodep-jarvis

app:
  enabled: true
  name: kodep-jarvis
  replicaCount: 1
  image:
    repository: docker.kodep.ru/kodep/kodep-jarvis
    tag: latest
    pullPolicy: Always
    pullSecret: docker.kodep.ru
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    name: kodep-jarvis
  resources: {}
  nodeSelector:
    apps: "yes"
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  existingSecret: new-jarvis-env

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: jarvis.kodep.team
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: jarvis
              port:
                number: 8000
  tls:
    - secretName: jarvis-tls
      hosts:
        - jarvis.kodep.team
