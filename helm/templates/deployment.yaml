{{- if .Values.app.enabled | default true }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "jarvis.labels" . | nindent 4 }}
    app: {{ include "jarvis.app.name" . }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "jarvis.app.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      annotations:
        {{- toYaml .Values.app.podAnnotations | nindent 8 }}
      labels:
        {{- include "jarvis.app.selectorLabels" . | nindent 8 }}
        {{- range $key, $value := .Values.app.podLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      {{- if .Values.app.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.app.image.pullSecret }}
      {{- end }}
      containers:
        - name: {{ include "jarvis.app.name" . }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: kodep-jarvis
              containerPort: {{ .Values.app.service.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.app.existingSecret  }}
          {{- if .Values.app.resources }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          {{- end }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
{{- end }}
